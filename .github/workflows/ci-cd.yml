name: Run tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Load environment
      run: |
        if [ ! -f ".env" ]; then
          cat > .env <<- 'EOF'
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          POSTGRES_DB=arms
          POSTGRES_SCHEMA=arms_schema
          POSTGRES_USER=arms_admin
          POSTGRES_PASSWORD=arms_qwerty
          POSTGRES_APP_USER=arms_app_user
          POSTGRES_APP_PASSWORD=arms_app_qwerty
          APP_PORT=8000
          EOF
        fi

    - name: 🐳 Start services
      run: |
        docker compose -f docker/develop/docker-compose.yml up -d
    
    - name: ⏳ Wait for services
      run: |
        sleep 10
        docker compose -f docker/develop/docker-compose.yml ps
    
    - name: 🧪 Run tests
      run: |
        docker compose -f docker/develop/docker-compose.yml exec -T dev-app pytest test/ -v
    
    - name: 🧹 Cleanup
      if: always()
      run: docker-compose -f docker/develop/docker-compose.yml down -v
