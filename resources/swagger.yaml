openapi: 3.0.0
info:
  title: Автоматизированная система управления требованиями (АСУТр)
  description: |
    API для системы управления требованиями согласно ТЗ ГОСТ 34.602-2020.
    Система предоставляет функционал для управления требованиями, их версионированием,
    согласованием, трассировкой и интеграцией со смежными системами.
  version: 1.0.0
  contact:
    name: АО "МИФИСТ"
    url: https://mifist.example.com
    email: support@mifist.example.com
servers:
  - url: https://api.asut.example.com/v1
    description: Production server
  - url: http://localhost:8000/v1
    description: Development server

tags:
  - name: Пользователи
    description: Управление пользователями системы
  - name: Проекты
    description: Управление проектами
  - name: Требования
    description: Управление требованиями и их содержимым
  - name: Workflow
    description: Управление жизненным циклом требований
  - name: Обсуждения
    description: Комментарии и обсуждения требований
  - name: Зависимости
    description: Управление связями между требованиями
  - name: Роли и права
    description: Управление ролями и разрешениями
  - name: Тестирование
    description: Покрытие требований тест-кейсами
  - name: Администрирование
    description: Административные функции системы

paths:
  # ================ Аутентификация и пользователи ================
  /auth/login:
    post:
      tags: [Пользователи]
      summary: Вход в систему
      description: Аутентификация пользователя через SSO/LDAP, в таблице user проверяется поле status - если inactive, то не даем разрешение на вход, отправляем код ответа 403
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Неверные учетные данные
        '403':
          description: Пользователь неактивен

  /auth/logout:
    post:
      tags: [Пользователи]
      summary: Выход из системы
      description: Завершение сессии пользователя, инвалидация JWT токена
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешный выход из системы
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Пользователь успешно вышел из системы"
                  logged_out_at:
                    type: string
                    format: date-time
                    example: "2023-12-01T15:30:00Z"
        '401':
          description: Неверный или отсутствующий токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                details: "Недействительный токен"
                error: "INVALID_TOKEN"
        '400':
          description: Токен уже недействителен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                details: "Токен уже деактивирован"
                error: "TOKEN_ALREADY_REVOKED"

  /users:
    get:
      tags: [Пользователи]
      summary: Получить список пользователей
      description: |
        Получение списка пользователей с пагинацией и фильтрацией.
        Доступно только администраторам. Поля в схеме User surname, name, email, берутся по запросу из SSO, так как хранятся там.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '403':
          description: Нет прав доступа

    post:
      tags: [Пользователи]
      summary: Создать пользователя
      description: Создание нового пользователя (для интеграции с SSO/LDAP). Проверяется external_id в таблице Person. Должна быть проверка на дубли по login, surname, name. В случае полного совпадения surname и name из SSO считается дубликатом. При создании пользователя ему присваивается глобальная роль по умолчанию (Пользователь),в таблице User заполняется поле global_role_id, в таблице User появляется новая запись, присваивается внутренний id, роль меняет администратор.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: Пользователь с таким login уже существует

  /users/{user_id}:
    get:
      tags: [Пользователи]
      summary: Получить информацию о пользователе.
      description: Данные по схеме User берутся из SSO (система делает запрос)
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Информация о пользователе. Содержит данные о проектных ролях
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '404':
          description: Пользователь не найден

  /users/{user_id}/changestatus:
    post:
      tags: [Пользователи]
      summary: Изменить статус пользователя
      description: Изменение статуса пользователя в системе (active/inactive). В случае успешного запроса новый статус сохраняется в поле Status таблицы User. В ответе возвращается обновленный статус пользователя
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          description: Идентификатор пользователя
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          required: true
          description: Новый статус пользователя
          schema:
            type: string
            enum: [active, inactive]
      responses:
        '200':
          description: Статус пользователя успешно изменен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdate'
        '400':
          description: Некорректный статус
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав для изменения статуса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{user_id}/changeprojectrole:
    post:
      tags: [Пользователи]
      summary: Управление ролями пользователя по проекту
      description: Управление ролями пользователя в проекте. Права доступа admin_view. Управлляется путем передачи массива ролей, Для UI сначала получаем список ролей пользователя, потом получаем действия от пользователя - удалить роль или добавить новую, выполняется мердж - роль удаляется из полученного массива или же добавляется. Далее сформированный массив User_Project_Role отправляется на сервер, в таблице User_project_role все записи с user_id сверяются с табличными, удаляются и добавляются. При пустом массиве у пользователя нет прав на проект
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          description: Идентификатор пользователя
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProjecRoletList'
      responses:
        '200':
          description: Список ролей пользователя обновился
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProjecRoletList'
        '403':
          description: Недостаточно прав для изменения ролец
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ================ Проекты ================
  /projects:
    get:
      tags: [Проекты]
      summary: Получить список проектов
      description: Получение списка проектов с возможностью фильтрации, в случае отсутствия - возвращать пустой массив. Проверять права на просмотр проекта, возыращать только доступные
      security:
        - bearerAuth: []
      parameters:
        - name: created_by
          in: query
          schema:
            type: integer
        - name: user_id
          required: true
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Список проектов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '403':
          description: Недостаточно прав для просмотр списка проектов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Проекты]
      summary: Создать проект
      description: Создание нового проекта, проверка прав на PROJECT_CREATE. В таблице project поле created_by_user_id заполняется по идентификатору текущего пользователя, role_id
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '403':
          description: Недостаточно прав для создания проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Проект с таким названием уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{project_id}:
    get:
      tags: [Проекты]
      summary: Получить информацию о проекте
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Информация о проекте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '403':
          description: Недостаточно прав для чтения проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Проекты]
      summary: Обновить проект (возможно изменить описание проекта)
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Проект обновлен
        '403':
          description: Недостаточно прав для обнлвления проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Проекты]
      summary: Удалить проект
      description: Полное удаление проекта со всеми связанными требованиями, обсуждениями и историей (в результате должна быть удалена информация из всех таблиц), для UI перед отправкой данного запроса обязано всплыть предупреждение с требованием подтвердить действие
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Проект успешно удален
        '403':
          description: Недостаточно прав для удаления проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Проект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Проект нельзя удалить (есть активные зависимости)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{project_id}/requirements:
    get:
      tags: [Проекты, Требования]
      summary: Получить требования проекта
      description: Получение всех требований проекта
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Список требований проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementListResponse'

  # ================ Требования ================
  /requirements:
    get:
      tags: [Требования]
      summary: Получить список требований с фильтрами
      description: Получение списка требований с возможностью фильтрации по типу, проекту и статусу
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          description: Фильтр по проекту
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: type
          in: query
          description: Фильтр по типу требования
          schema:
            type: string
            enum: [functional, non-functional, business]
          example: "functional"
        - name: status
          in: query
          description: Фильтр по статусу требования
          schema:
            type: string
            enum: [draft, review, approved, rejected, completed]
          example: "approved"
        - name: created_by
          in: query
          description: Фильтр по создателю требования
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: priority
          in: query
          description: Фильтр по приоритету
          schema:
            type: integer
            minimum: 1
            maximum: 5
            example: 1

      responses:
        '200':
          description: Список требований
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementListResponse'
        '400':
          description: Некорректные параметры фильтрации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав для просмотра требований
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Требования]
      summary: Создать требование
      description: Создание нового требования с валидацией данных
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementCreate'
      responses:
        '201':
          description: Требование создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementFull'

  /requirements/{requirement_id}:
    get:
      tags: [Требования]
      summary: Получить требование
      description: Получение полной информации о требовании
      security:
        - bearerAuth: []
      parameters:
        - name: requirement_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Информация о требовании
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementFull'

    put:
      tags: [Требования]
      summary: Обновить требование
      description: Обновление требования с версионированием
      security:
        - bearerAuth: []
      parameters:
        - name: requirement_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementUpdate'
      responses:
        '200':
          description: Требование обновлено
        '409':
          description: Конфликт версий

    delete:
      tags: [Требования]
      summary: Удалить требование
      description: Удаление требования (мягкое удаление)
      security:
        - bearerAuth: []
      parameters:
        - name: requirement_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Требование удалено

  /requirements/export:
    get:
      tags: [Требования]
      summary: Экспорт требований в CSV
      description: Экспорт списка требований с примененными фильтрами в формате CSV
      security:
        - bearerAuth: []
      parameters:
        # Все те же параметры фильтрации что и в /requirements
        - name: project_id
          in: query
          description: Фильтр по проекту
          schema:
            type: integer
            minimum: 1
        - name: type
          in: query
          description: Фильтр по типу требования
          schema:
            type: string
            enum: [functional, non-functional, business]
        - name: status
          in: query
          description: Фильтр по статусу требования
          schema:
            type: string
            enum: [draft, review, approved, rejected, completed]
        # Дополнительные параметры для экспорта
        - name: fields
          in: query
          description: Поля для экспорта (через запятую)
          schema:
            type: string
            example: "id,name,type,status,priority,created_at,created_by"
        - name: filename
          in: query
          description: Имя файла (без расширения)
          schema:
            type: string
            example: "requirements_export"
      responses:
        '200':
          description: CSV файл с требованиями
          headers:
            Content-Disposition:
              description: Заголовок для скачивания файла
              schema:
                type: string
                example: 'attachment; filename="requirements_export_20231201.csv"'
            Content-Type:
              description: MIME тип
              schema:
                type: string
                example: "text/csv; charset=utf-8"
          content:
            text/csv:
              schema:
                type: string
                example: |
                  ID,Name,Type,Status,Priority,Created At,Created By
                  1,"User Authentication",functional,approved,5,"2023-12-01 10:00:00","Ivan Ivanov"
                  2,"Data Validation",non-functional,review,4,"2023-12-01 11:00:00","Petr Petrov"
        '400':
          description: Некорректные параметры экспорта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Слишком много данных для экспорта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: "Превышен лимит экспорта. Максимум 10000 записей"
                error_code: "EXPORT_LIMIT_EXCEEDED"

  /requirements/{requirement_id}/content:
    get:
      tags: [Требования]
      summary: Получить содержимое требования
      description: Получение текущего содержимого требования
      security:
        - bearerAuth: []
      parameters:
        - name: requirement_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Содержимое требования
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementContent'

    put:
      tags: [Требования]
      summary: Обновить содержимое требования
      description: Обновление содержимого с созданием новой версии
      security:
        - bearerAuth: []
      parameters:
        - name: requirement_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementContentUpdate'
      responses:
        '200':
          description: Содержимое обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementContent'

  /requirements/{requirement_id}/content/history:
    get:
      tags: [Требования]
      summary: История изменений содержимого
      description: Получение истории изменений содержимого требования
      security:
        - bearerAuth: []
      parameters:
        - name: requirement_id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: История изменений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentHistoryList'

  /requirements/{requirement_id}/workflow:
    get:
      tags: [Workflow]
      summary: Получить текущий статус workflow
      description: Получение текущего состояния workflow требования
      security:
        - bearerAuth: []
      parameters:
        - name: requirement_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Текущий статус workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowStatus'

    post:
      tags: [Workflow]
      summary: Изменить статус workflow
      description: Изменение статуса требования в соответствии с workflow,
      security:
        - bearerAuth: []
      parameters:
        - name: requirement_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowTransition'
      responses:
        '200':
          description: Статус изменен
        '400':
          description: Недопустимый переход статуса
        '403':
          description: Нет прав для изменения статуса

  /requirements/{requirement_id}/workflow/history:
    get:
      tags: [Workflow]
      summary: История изменений workflow
      description: Получение истории изменений статуса требования
      security:
        - bearerAuth: []
      parameters:
        - name: requirement_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: История workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowHistoryList'

  # ================ Согласование требований ================
  /requirements/{requirement_id}/approval:
    post:
      tags: [Workflow]
      summary: Запустить процесс согласования - 'это значит переместить в статус На проверке (Review)'
      description: Запуск процесса согласования требования
      security:
        - bearerAuth: []
      parameters:
        - name: requirement_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Процесс согласования запущен
        '400':
          description: Недопустимый переход статуса
        '403':
          description: Нет прав для изменения статуса

  /requirements/{requirement_id}/approve:
    post:
      tags: [Workflow]
      summary: Утвердить требование
      description: Утверждение требования уполномоченным лицом
      security:
        - bearerAuth: []
      parameters:
        - name: requirement_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      responses:
        '200':
          description: Требование утверждено
        '403':
          description: Нет прав на утверждение

  /requirements/{requirement_id}/reject:
    post:
      tags: [Workflow]
      summary: Отклонить требование
      description: Отклонение требования с комментарием
      security:
        - bearerAuth: []
      parameters:
        - name: requirement_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - comment
                - reason
              properties:
                comment:
                  type: string
                reason:
                  type: string
                  enum: [incorrect, incomplete, duplicate, outdated]
      responses:
        '200':
          description: Требование отклонено
        '403':
          description: Нет прав на отклонение

