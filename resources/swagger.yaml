  # ================ Зависимости требований ================
  /requirements/{requirement_id}/dependencies:
    get:
      tags: [Зависимости]
      summary: Получить зависимости требования
      description: Получение всех зависимостей требования (описать селект к бд)
      security:
        - bearerAuth: []
      parameters:
        - name: requirement_id
          in: path
          required: true
          schema:
            type: integer
        - name: direction
          in: query
          schema:
            type: string
            enum: [incoming, outgoing, both]
            default: both
      responses:
        '200':
          description: Список зависимостей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyList'

    post:
      tags: [Зависимости]
      summary: Создать зависимость
      description: Создание новой зависимости между требованиями (описать переход зависимостей типов требований)
      security:
        - bearerAuth: []
      parameters:
        - name: requirement_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependencyCreate'
      responses:
        '201':
          description: Зависимость создана
        '400':
          description: Недопустимая зависимость

  /dependencies/{dependency_id}:
    delete:
      tags: [Зависимости]
      summary: Удалить зависимость
      description: Удаление зависимости между требованиями
      security:
        - bearerAuth: []
      parameters:
        - name: dependency_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Зависимость удалена

  # ================ Трассировка требований ================
  /requirements/{requirement_id}/traceability:
    get:
      tags: [Требования]
      summary: Матрица трассируемости
      description: Получение матрицы трассируемости требования (другие тербваония, тест-кейсы, написать селект, который бв это описывал)
      security:
        - bearerAuth: []
      parameters:
        - name: requirement_id
          in: path
          required: true
          schema:
            type: integer
        - name: depth
          in: query
          schema:
            type: integer
            default: 2
      responses:
        '200':
          description: Матрица трассируемости
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceabilityMatrix'

  # ================ Покрытие тест-кейсами ================
  /requirements/{requirement_id}/test-coverage:
    get:
      tags: [Тестирование]
      summary: Получить покрытие тест-кейсами
      description: Получение информации о покрытии требования тест-кейсами
      security:
        - bearerAuth: []
      parameters:
        - name: requirement_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Покрытие тест-кейсами
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCoverage'

    post:
      tags: [Тестирование]
      summary: Обновить покрытие тест-кейсами
      description: Обновление информации о покрытии тест-кейсами
      security:
        - bearerAuth: []
      parameters:
        - name: requirement_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestCoverageUpdate'
      responses:
        '200':
          description: Покрытие обновлено

  # ================ Отчетность и аналитика ================
  /reports/kpi:
    get:
      tags: [Администрирование]
      summary: Дашборд KPI
      description: Получение дашборда с ключевыми показателями эффективности
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          schema:
            type: integer
        - name: period_start
          in: query
          schema:
            type: string
            format: date
        - name: period_end
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Дашборд KPI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPIDashboard'

  /reports/requirements:
    get:
      tags: [Администрирование]
      summary: Отчет по требованиям
      description: Генерация отчета по требованиям
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: integer
        - name: format
          in: query
          schema:
            type: string
            enum: [json, pdf, csv]
            default: json
        - name: include_history
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Отчет по требованиям
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementsReport'
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary

  /reports/traceability:
    get:
      tags: [Администрирование]
      summary: Отчет по трассируемости
      description: Генерация отчета по трассируемости требований
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Отчет по трассируемости
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceabilityReport'

  # ================ Администрирование ================
  /admin/roles:
    get:
      tags: [Администрирование]
      summary: Получить список ролей
      description: Получение списка всех ролей в системе
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список ролей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'

    post:
      tags: [Администрирование]
      summary: Создать роль
      description: Создание новой роли
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '201':
          description: Роль создана

  /admin/permissions:
    get:
      tags: [Администрирование]
      summary: Получить список разрешений
      description: Получение списка всех разрешений в системе
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список разрешений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionList'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ================ Базовые схемы ================
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
        timestamp:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer

    # ================ Пользователи ================
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: integer
        external_id:
          type: string
        login:
          type: string
          description: Логин пользователя (хранится в SSO)
        surname:
          type: string
          description: Фамилия пользователя (хранится в SSO)
        name:
          type: string
          description: Имя пользователя (хранится в SSO)
        email:
          type: string
          format: email
          description: Электронная почта пользователя (хранится в SSO)
        status:
          type: string
          enum: [active, inactive]
        datetime_created:
          type: string
          format: date-time

    UserDetail:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            project_roles:
              type: array
              items:
                $ref: '#/components/schemas/UserProjectRole'
            global_roles:
              type: integer
    UserCreate:
      type: object
      properties:
        status:
          type: string
          enum: [active, inactive]
          default: active
        login:
          type: string
        name:
          type: string
        surname:
          type: string
        email:
          type: string

    UserUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [active, inactive]

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'

    UserProjectRole:
      type: object
      properties:
        project_id:
          type: integer
        project_name:
          type: string
        role_id:
          type: integer
        role_code:
          type: string
        role_name:
          type: string

    UserProjecRoletList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserProjectRole'

    # ================ Проекты ================
    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, archived, draft]
        created_by_user_id:
          type: integer

    ProjectCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
        status:
          type: string
          enum: [active, draft]
          default: active

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
        status:
          type: string
          enum: [active, archived]

    ProjectList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Project'

    # ================ Требования ================
    Requirement:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        name:
          type: string
        type:
          type: string
        created_at:
          type: string
          format: date-time
        created_by_user_id:
          type: integer
        path:
          type: string
        depth:
          type: integer
        requirement_group_id:
          type: integer

    RequirementFull:
      allOf:
        - $ref: '#/components/schemas/Requirement'
        - type: object
          properties:
            content:
              $ref: '#/components/schemas/RequirementContent'
            workflow:
              $ref: '#/components/schemas/RequirementWorkflow'
            dependencies:
              type: array
              items:
                $ref: '#/components/schemas/Dependency'

    RequirementCreate:
      type: object
      required:
        - project_id
        - name
        - description_text
      properties:
        project_id:
          type: integer
        name:
          type: string
          maxLength: 255
        type:
          type: string
        parent_id:
          type: integer
        content:
          $ref: '#/components/schemas/RequirementContentCreate'

    RequirementUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        type:
          type: string

    RequirementListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RequirementFull'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ================ Содержимое требований ================
    RequirementContent:
      type: object
      properties:
        id:
          type: integer
        development_basis:
          type: string
        development_purpose:
          type: string
        description_text:
          type: string
        acceptance_criteria:
          type: string
        document_requires:
          type: string
        requirement_id:
          type: integer

    RequirementContentCreate:
      type: object
      properties:
        development_basis:
          type: string
        development_purpose:
          type: string
        description_text:
          type: string
        acceptance_criteria:
          type: string
        document_requires:
          type: string

    RequirementContentUpdate:
      type: object
      properties:
        development_basis:
          type: string
        development_purpose:
          type: string
        description_text:
          type: string
        acceptance_criteria:
          type: string
        document_requires:
          type: string

    ContentHistoryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContentHistoryItem'

    ContentHistoryItem:
      type: object
      properties:
        id:
          type: integer
        prev_req_content_id:
          type: integer
        created_by_user_id:
          type: integer
        created_at:
          type: string
          format: date-time
        is_active:
          type: boolean
        content:
          $ref: '#/components/schemas/RequirementContent'

    # ================ Workflow ================
    RequirementWorkflow:
      type: object
      properties:
        id:
          type: integer
        requirement_content_id:
          type: integer
        priority:
          type: integer
          minimum: 1
          maximum: 5
        status:
          type: string
          enum: [draft, review, approved, rejected, implemented, verified, archived]

    WorkflowStatus:
      allOf:
        - $ref: '#/components/schemas/RequirementWorkflow'
        - type: object
          properties:
            requirement_name:
              type: string
            can_transition_to:
              type: array
              items:
                type: string

    WorkflowTransition:
      type: object
      required:
        - new_status
      properties:
        new_status:
          type: string
          enum: [draft, review, approved, rejected, implemented, verified, archived]
        comment:
          type: string

    WorkflowHistoryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowHistoryItem'

    WorkflowHistoryItem:
      type: object
      properties:
        id:
          type: integer
        prev_req_workflow_id:
          type: integer
        created_by_user_id:
          type: integer
        created_at:
          type: string
          format: date-time
        is_active:
          type: boolean
        workflow:
          $ref: '#/components/schemas/RequirementWorkflow'

    # ================ Обсуждения ================
    # Comment:
    #   type: object
    #   properties:
    #     id:
    #       type: integer
    #     discussion_id:
    #       type: integer
    #     created_by_user_id:
    #       type: integer
    #     created_at:
    #       type: string
    #       format: date-time
    #     content:
    #       type: string

    # CommentCreate:
    #   type: object
    #   required:
    #     - content
    #   properties:
    #     content:
    #       type: string

    # CommentList:
    #   type: object
    #   properties:
    #     data:
    #       type: array
    #       items:
    #         $ref: '#/components/schemas/Comment'

    # ================ Зависимости ================
    Dependency:
      type: object
      properties:
        id:
          type: integer
        target_requirement_id:
          type: integer
        source_requirement_id:
          type: integer
        type:
          type: string
          enum: [blocks, depends_on, related_to, duplicates, refines]
        strength:
          type: integer
          minimum: 1
          maximum: 5
        description:
          type: string
        source_requirement_group_id:
          type: integer
        target_requirement_group_id:
          type: integer

    DependencyCreate:
      type: object
      required:
        - target_requirement_id
        - type
      properties:
        target_requirement_id:
          type: integer
        type:
          type: string
          enum: [blocks, depends_on, related_to, duplicates, refines]
        strength:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        description:
          type: string

    DependencyList:
      type: object
      properties:
        incoming:
          type: array
          items:
            $ref: '#/components/schemas/Dependency'
        outgoing:
          type: array
          items:
            $ref: '#/components/schemas/Dependency'

    # ================ Трассировка ================
    TraceabilityMatrix:
      type: object
      properties:
        requirement_id:
          type: integer
        requirement_name:
          type: string
        source:
          type: array
          items:
            $ref: '#/components/schemas/TraceabilityItem'
        target:
          type: array
          items:
            $ref: '#/components/schemas/TraceabilityItem'

    TraceabilityItem:
      type: object
      properties:
        requirement_id:
          type: integer
        requirement_name:
          type: string

    # ================ Тестирование ================
    TestCoverage:
      type: object
      properties:
        test_case_version_id:
          type: string
        requirement_id:
          type: integer
        created_by_user_id:
          type: integer
        created_at:
          type: string
          format: date-time
        test_case_status:
          type: string
          enum: [passed, failed, blocked, not_executed]

    TestCoverageUpdate:
      type: object
      required:
        - test_case_version_id
        - test_case_status
      properties:
        test_case_version_id:
          type: string
        test_case_status:
          type: string
          enum: [passed, failed, blocked, not_executed]

    TestStatusImport:
      type: object
      required:
        - test_cases
      properties:
        test_cases:
          type: array
          items:
            $ref: '#/components/schemas/TestCaseStatus'

    TestCaseStatus:
      type: object
      required:
        - test_case_id
        - requirement_id
        - status
      properties:
        test_case_id:
          type: string
        requirement_id:
          type: integer
        status:
          type: string
          enum: [passed, failed, blocked, not_executed]
        execution_date:
          type: string
          format: date-time

    # ================ Отчетность ================
    KPIDashboard:
      type: object
      properties:
        period:
          type: object
          properties:
            start:
              type: string
              format: date
            end:
              type: string
              format: date
        metrics:
          type: object
          properties:
            total_requirements:
              type: integer
            requirements_approved:
              type: integer
            requirements_approval:
              type: integer
            requirements_rejected:
              type: integer

    RequirementsReport:
      type: object
      properties:
        project_id:
          type: integer
        project_name:
          type: string
        generated_at:
          type: string
          format: date-time
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/RequirementFull'
        summary:
          type: object
          properties:
            total:
              type: integer
            by_type:
              type: object
            by_status:
              type: object

    TraceabilityReport:
      type: object
      properties:
        project_id:
          type: integer
        project_name:
          type: string
        generated_at:
          type: string
          format: date-time
        traceability_matrix:
          type: array
          items:
            $ref: '#/components/schemas/TraceabilityReportItem'

    TraceabilityReportItem:
      type: object
      properties:
        requirement_id:
          type: integer
        requirement_name:
          type: string
        linked_to:
          type: array
          items:
            type: integer
        linked_from:
          type: array
          items:
            type: integer
        test_coverage:
          type: boolean

    # ================ Роли и права ================
    Role:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        description:
          type: string

    RoleCreate:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string

    RoleList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    Permission:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        description:
          type: string

    PermissionList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    # ================ Аудит ================
  responses:
    Unauthorized:
      description: Требуется аутентификация
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Unauthorized"
            message: "Требуется аутентификация"
            timestamp: "2025-01-10T10:30:00Z"

    Forbidden:
      description: Нет прав доступа
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Forbidden"
            message: "Недостаточно прав для выполнения операции"
            timestamp: "2025-01-10T10:30:00Z"

    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Not Found"
            message: "Запрошенный ресурс не найден"
            timestamp: "2025-01-10T10:30:00Z"

    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Validation Error"
            message: "Ошибка валидации входных данных"
            details:
              field: "name"
              error: "Обязательное поле"
              timestamp: "2025-01-10T10:30:00Z"